<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Tareas Colectivo</title>
    
    <!-- 🔌 AQUÍ INTEGRAMOS TU ARCHIVO DE DISEÑO: style.css -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">
    <h1>📚 Hub Comunitario de Tareas</h1>
    
    <!-- Formulario para mandar a Firebase -->
    <form class="form-tarea" id="formulario-tarea">
        <h2 style="margin-top:0; font-size: 18px; color: #fff;">Subir nueva aportación</h2>
        <div class="form-group">
            <label>Materia / Asignatura</label>
            <input type="text" id="materia" placeholder="Ej. Cultura Digital, Cálculo..." required>
        </div>
        <div class="form-group">
            <label>Descripción de la Tarea</label>
            <input type="text" id="descripcion" placeholder="Ej. Resumen de la página 45 o Maqueta" required>
        </div>
        <div class="form-group">
            <label>Estado</label>
            <select id="estado">
                <option value="pendiente">⏳ Pendiente (Por hacer)</option>
                <option value="hecha">✅ Ya resuelta (Compartir aportación)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Enlace al documento / recurso (Opcional)</label>
            <input type="url" id="enlace" placeholder="https://drive.google.com/...">
        </div>
        <div class="form-group">
            <label>Subir captura / evidencia (Imagen Opcional)</label>
            <input type="file" id="imagenInput" accept="image/*">
        </div>
        <button type="submit" class="btn">Publicar en el Tablón</button>
    </form>

    <h2>📌 Tablón de la Comunidad</h2>
    <div class="grid-tareas" id="tablon">
        <!-- Las tareas de la nube aparecerán mágicamente aquí -->
    </div>
</div>

<!-- 🔌 AQUÍ INTEGRAMOS TU ARCHIVO CEREBRO (CON FIREBASE): app.js -->
<!-- El type="module" es clave para que Firebase funcione -->
<script src="app.js" type="module"></script>

</body>
</html>
